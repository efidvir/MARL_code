name: "MCPTT Emergency Communication Test"
description: "Test 3GPP TS 22.179 MCPTT emergency communication features during disaster"

duration_ticks: 100

events:
  - tick: 30
    type: "sever_core"
    parameters: {}

  - tick: 60
    type: "rescue_force_arrival"
    parameters:
      num_ues: 10
      coverage_area: "disaster_zone"

  - tick: 70
    type: "mcppt_emergency_alert"
    parameters:
      ue_id: "Rescue_UE_1"
      emergency_type: "emergency"

  - tick: 75
    type: "mcppt_emergency_alert"
    parameters:
      ue_id: "Rescue_UE_2"
      emergency_type: "imminent_peril"

  - tick: 85
    type: "mcppt_emergency_call"
    parameters:
      caller_ue: "Rescue_UE_1"
      target_ue: "Rescue_UE_3"
      emergency_type: "emergency"

  - tick: 90
    type: "mcppt_emergency_call"
    parameters:
      caller_ue: "Rescue_UE_2"
      target_ue: "Rescue_UE_4"
      emergency_type: "imminent_peril"

traffic_profiles:
  # Regular UEs with higher traffic patterns to support UE-to-UE communication
  UE_1:
    life_safety:
      baseline_rate: 15.0
      burst_probability: 0.05
      burst_multiplier: 1.5
