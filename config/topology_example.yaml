nodes:
  - id: "gNB1"
    type: "gNB-Site"
    initial_energy: 1.0
    coverage_area: "zoneA"

  - id: "gNB2"
    type: "gNB-Site"
    initial_energy: 1.0
    coverage_area: "zoneA"

  - id: "relay1"
    type: "Relay"
    initial_energy: 0.8
    coverage_area: "zoneA"

  - id: "edgeUPF1"
    type: "EdgeUPF"
    initial_energy: 1.0
    coverage_area: "zoneA"

  - id: "core"
    type: "Core"
    initial_energy: 1.0

  - id: "UE1"
    type: "UE"
    initial_energy: 1.0
    coverage_area: "zoneA"

  - id: "UE2"
    type: "UE"
    initial_energy: 1.0
    coverage_area: "zoneA"

  - id: "Rescue_UE_1"
    type: "UE"
    initial_energy: 1.0
    coverage_area: "zoneA"
    is_rescue_service: true

  - id: "UE3"
    type: "UE"
    initial_energy: 1.0
    coverage_area: "zoneA"

  - id: "UE4"
    type: "UE"
    initial_energy: 1.0
    coverage_area: "zoneA"

  - id: "Rescue_UE_2"
    type: "UE"
    initial_energy: 1.0
    coverage_area: "zoneA"
    is_rescue_service: true

links:
  - id: "L1"
    endpoints: ["gNB1", "relay1"]
    capacity: 500
    latency: 2
    type: "fiber"

  - id: "L2"
    endpoints: ["gNB2", "relay1"]
    capacity: 300
    latency: 3
    type: "microwave"

  - id: "L3"
    endpoints: ["relay1", "edgeUPF1"]
    capacity: 800
    latency: 1
    type: "fiber"

  - id: "L4"
    endpoints: ["edgeUPF1", "core"]
    capacity: 1000
    latency: 5
    type: "fiber"

  - id: "L5"
    endpoints: ["gNB1", "gNB2"]
    capacity: 200
    latency: 1
    type: "iab"

  - id: "link_ue1"
    endpoints: ["UE1", "gNB1"]
    capacity: 50
    latency: 1
    type: "microwave"

  - id: "link_ue2"
    endpoints: ["UE2", "gNB1"]
    capacity: 50
    latency: 1
    type: "microwave"

  - id: "link_rescue1"
    endpoints: ["Rescue_UE_1", "gNB1"]
    capacity: 80
    latency: 1
    type: "microwave"

  - id: "link_ue3"
    endpoints: ["UE3", "gNB2"]
    capacity: 50
    latency: 1
    type: "microwave"

  - id: "link_ue4"
    endpoints: ["UE4", "gNB2"]
    capacity: 50
    latency: 1
    type: "microwave"

  - id: "link_rescue2"
    endpoints: ["Rescue_UE_2", "gNB2"]
    capacity: 80
    latency: 1
    type: "microwave"
