name: "Large Network Island Mode Test"
description: "Test island-mode operation in a 200-node network with DU/CU separation and random island formation"

duration_ticks: 500

events:
  - tick: 100
    type: "sever_core"
    parameters: {}

  - tick: 150
    type: "traffic_surge"
    parameters:
      node_id: "DU_5"
      duration: 50
      multiplier: 3.0

  - tick: 200
    type: "fail_link"
    parameters:
      link_id: "backhaul_15"

  - tick: 250
    type: "traffic_surge"
    parameters:
      node_id: "CU_3"
      duration: 40
      multiplier: 2.5

  - tick: 350
    type: "energy_depletion"
    parameters:
      node_id: "RELAY_10"

traffic_profiles:
  # Sample traffic profiles for key nodes (would be auto-generated for all 200 nodes)
  DU_1:
    life_safety:
      baseline_rate: 12.0
      burst_probability: 0.03
      burst_multiplier: 1.5
    operations:
      baseline_rate: 18.0
      burst_probability: 0.05
      burst_multiplier: 2.0
    telemetry:
      baseline_rate: 25.0
      burst_probability: 0.08
      burst_multiplier: 1.8
    best_effort:
      baseline_rate: 35.0
      burst_probability: 0.12
      burst_multiplier: 2.2

  DU_5:
    life_safety:
      baseline_rate: 15.0
      burst_probability: 0.04
      burst_multiplier: 1.6
