name: "Basic Island Mode Test"
description: "Test basic island-mode operation after core link severance with traffic surge"

duration_ticks: 300

events:
  - tick: 50
    type: "sever_core"
    parameters: {}

  - tick: 100
    type: "traffic_surge"
    parameters:
      node_id: "gNB1"
      duration: 30
      multiplier: 2.5

  - tick: 150
    type: "fail_link"
    parameters:
      link_id: "L2"

  - tick: 200
    type: "energy_depletion"
    parameters:
      node_id: "relay1"

traffic_profiles:
  gNB1:
    life_safety:
      baseline_rate: 8.0
      burst_probability: 0.05
      burst_multiplier: 1.5
    operations:
      baseline_rate: 12.0
      burst_probability: 0.1
      burst_multiplier: 2.0
    telemetry:
      baseline_rate: 18.0
      burst_probability: 0.15
      burst_multiplier: 1.8
    best_effort:
      baseline_rate: 25.0
      burst_probability: 0.2
      burst_multiplier: 2.5

  gNB2:
    life_safety:
      baseline_rate: 6.0
      burst_probability: 0.05
      burst_multiplier: 1.5
    operations:
      baseline_rate: 10.0
      burst_probability: 0.1
      burst_multiplier: 2.0
    telemetry:
      baseline_rate: 15.0
      burst_probability: 0.15
      burst_multiplier: 1.8
    best_effort:
      baseline_rate: 20.0
      burst_probability: 0.2
      burst_multiplier: 2.5

  relay1:
    life_safety:
      baseline_rate: 2.0
      burst_probability: 0.02
      burst_multiplier: 1.2
    operations:
      baseline_rate: 5.0
      burst_probability: 0.05
      burst_multiplier: 1.5
    telemetry:
      baseline_rate: 8.0
      burst_probability: 0.08
      burst_multiplier: 1.3
    best_effort:
      baseline_rate: 10.0
      burst_probability: 0.1
      burst_multiplier: 1.8

  edgeUPF1:
    life_safety:
      baseline_rate: 3.0
      burst_probability: 0.03
      burst_multiplier: 1.3
    operations:
      baseline_rate: 8.0
      burst_probability: 0.07
      burst_multiplier: 1.6
    telemetry:
      baseline_rate: 12.0
      burst_probability: 0.1
      burst_multiplier: 1.5
    best_effort:
      baseline_rate: 18.0
      burst_probability: 0.15
      burst_multiplier: 2.0
